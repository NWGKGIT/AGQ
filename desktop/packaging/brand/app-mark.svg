  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#background)"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="20"/>

  <g fill="none" stroke="url(#orbit)" stroke-linecap="round">
    <path d="M218 644C147 515 226 351 388 263C550 175 744 197 821 326C898 455 821 619 659 708C497 797 293 773 218 644Z" stroke-width="44"/>
    <path d="M268 307C383 214 571 215 712 304" stroke-width="22" stroke-opacity="0.78"/>
  </g>

  <g stroke="#e0f2fe" stroke-width="18" stroke-linecap="round" opacity="0.92">
    <path d="M302 384L272 352"/>
    <path d="M377 317L360 277"/>
    <path d="M465 280L461 235"/>
    <path d="M558 277L568 233"/>
    <path d="M646 310L670 270"/>
    <path d="M721 371L755 340"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="178" fill="#111827" stroke="#ffffff" stroke-opacity="0.24" stroke-width="14"/>
    <circle cx="512" cy="512" r="139" fill="url(#token)"/>
    <path d="M512 403L614 579H410L512 403Z" fill="#4338ca"/>
    <circle cx="512" cy="522" r="45" fill="#ddd6fe"/>
