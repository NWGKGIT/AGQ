<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Antigravity Token Monitor app mark</title>
  <desc id="description">A token floating within a blue and violet orbital gauge</desc>
  <defs>
    <linearGradient id="background" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.52" stop-color="#312e81"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="orbit" x1="202" y1="270" x2="841" y2="758" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.48" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="token" x1="390" y1="374" x2="637" y2="652" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
