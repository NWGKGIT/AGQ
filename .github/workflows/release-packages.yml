name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version (for example 1.0.0)
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $REQUESTED_VERSION" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
  windows-portable:
    needs: release-metadata
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Build portable Windows package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          $goBin = Join-Path $env:RUNNER_TEMP 'go-bin'
          New-Item -ItemType Directory -Path $goBin -Force | Out-Null
          $env:GOBIN = $goBin
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          npm ci --prefix desktop/frontend
          npm run build --prefix desktop/frontend
          Push-Location desktop
          try {
            wails build -clean -trimpath -platform windows/amd64 -webview2 browser -o AGQ.exe
          } finally {
            Pop-Location
          }
          $semanticVersion = $env:RELEASE_VERSION
          if ($semanticVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Release version must use major.minor.patch: $semanticVersion" }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item desktop/build/bin/AGQ.exe release/AGQ.exe
          Compress-Archive -Path release/AGQ.exe -DestinationPath "AGQ-$semanticVersion-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AGQ-windows-portable
          path: AGQ-*-windows-x64.zip
          if-no-files-found: error

  windows-msix:
    needs: release-metadata
    if: ${{ vars.WINDOWS_PACKAGE_IDENTITY_NAME != '' && vars.WINDOWS_PACKAGE_PUBLISHER != '' && vars.WINDOWS_PUBLISHER_DISPLAY_NAME != '' }}
    runs-on: windows-2025
    env:
      WINDOWS_PACKAGE_IDENTITY_NAME: ${{ vars.WINDOWS_PACKAGE_IDENTITY_NAME }}
      WINDOWS_PACKAGE_PUBLISHER: ${{ vars.WINDOWS_PACKAGE_PUBLISHER }}
      WINDOWS_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails and frontend dependencies
        shell: pwsh
        run: |
          $goBin = Join-Path $env:RUNNER_TEMP 'go-bin'
          New-Item -ItemType Directory -Path $goBin -Force | Out-Null
          $env:GOBIN = $goBin
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          npm ci --prefix desktop/frontend

      - name: Build unsigned Store package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          if (-not $env:WINDOWS_PACKAGE_IDENTITY_NAME -or
              -not $env:WINDOWS_PACKAGE_PUBLISHER -or
              -not $env:WINDOWS_PUBLISHER_DISPLAY_NAME) {
            throw 'Set all three protected Windows package identity repository variables before releasing.'
          }
          $semanticVersion = $env:RELEASE_VERSION
          if ($semanticVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use major.minor.patch: $semanticVersion"
          }
          $version = "$semanticVersion.0"
          .\desktop\packaging\windows\build-msix.ps1 `
            -PackageIdentityName $env:WINDOWS_PACKAGE_IDENTITY_NAME `
            -Publisher $env:WINDOWS_PACKAGE_PUBLISHER `
            -PublisherDisplayName $env:WINDOWS_PUBLISHER_DISPLAY_NAME `
            -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: AGQ-windows-x64
          path: |
            desktop/build/msix/*.msix
            desktop/build/msix/*.sha256
          if-no-files-found: error

  linux-native:
    needs: release-metadata
    runs-on: ubuntu-24.04
    name: ${{ matrix.label }} (Ubuntu Docker host)
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            label: deb - Debian 12 container
            artifact: agq_*.deb
          - kind: rpm
            label: rpm - Fedora 42 container
            artifact: agq-*.rpm
          - kind: arch
            label: arch - Arch container
            artifact: agq-*.pkg.tar.zst
    steps:
      - uses: actions/checkout@v4
      - name: Build native package
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: ./desktop/packaging/linux/build-native-packages.sh "${{ matrix.kind }}"
      - name: Test package in clean target container
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: ./desktop/packaging/linux/test-native-package.sh "${{ matrix.kind }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AGQ-linux-${{ matrix.kind }}
          path: |
            desktop/build/packages/${{ matrix.artifact }}
            desktop/build/packages/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  linux-appimage:
    needs: release-metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: ./desktop/packaging/linux/build-appimage.sh
      - name: Test AppImage extraction
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: ./desktop/packaging/linux/test-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AGQ-linux-x86_64
          path: |
            desktop/build/appimage/*.AppImage
            desktop/build/appimage/*.sha256
          if-no-files-found: error

  release:
    needs:
      [
        release-metadata,
        windows-portable,
        windows-msix,
        linux-native,
        linux-appimage,
      ]
    if: ${{ always() && needs.windows-portable.result == 'success' && needs.linux-native.result == 'success' && needs.linux-appimage.result == 'success' && (needs.windows-msix.result == 'success' || needs.windows-msix.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Validate release assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0)
          ((${#assets[@]} > 0))
          for checksum in "${assets[@]}"; do
            [[ "$checksum" == *.sha256 ]] || continue
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done
          duplicate=$(printf '%s\n' "${assets[@]}" | xargs -n1 basename | sort | uniq -d)
          [[ -z "$duplicate" ]] || { echo "Duplicate release assets: $duplicate" >&2; exit 1; }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          tag="v$version"
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AGQ $version" --generate-notes
          fi
