name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version (for example 1.0.0)
        required: true
        default: 1.0.0
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  windows-msix:
    runs-on: windows-2025
    env:
      WINDOWS_PACKAGE_IDENTITY_NAME: ${{ vars.WINDOWS_PACKAGE_IDENTITY_NAME }}
      WINDOWS_PACKAGE_PUBLISHER: ${{ vars.WINDOWS_PACKAGE_PUBLISHER }}
      WINDOWS_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails and frontend dependencies
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          npm ci --prefix desktop/frontend

      - name: Build unsigned Store package
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if (-not $env:WINDOWS_PACKAGE_IDENTITY_NAME -or
              -not $env:WINDOWS_PACKAGE_PUBLISHER -or
              -not $env:WINDOWS_PUBLISHER_DISPLAY_NAME) {
            throw 'Set all three protected Windows package identity repository variables before releasing.'
          }
          $semanticVersion = if ($env:DISPATCH_VERSION) { $env:DISPATCH_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($semanticVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use major.minor.patch: $semanticVersion"
          }
          $version = "$semanticVersion.0"
          .\desktop\packaging\windows\build-msix.ps1 `
            -PackageIdentityName $env:WINDOWS_PACKAGE_IDENTITY_NAME `
            -Publisher $env:WINDOWS_PACKAGE_PUBLISHER `
            -PublisherDisplayName $env:WINDOWS_PUBLISHER_DISPLAY_NAME `
            -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: AGQ-windows-x64
          path: |
            desktop/build/msix/*.msix
            desktop/build/msix/*.sha256
          if-no-files-found: error

  linux-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-bin imagemagick
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          npm ci --prefix desktop/frontend

      - name: Install AppImage packaging tools
        run: |
          curl -fsSL -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o appimagetool-x86_64.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./desktop/packaging/linux/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AGQ-linux-x86_64
          path: |
            desktop/build/appimage/*.AppImage
            desktop/build/appimage/*.sha256
          if-no-files-found: error
