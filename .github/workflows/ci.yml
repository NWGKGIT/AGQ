name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend

      - name: Test monitor core
        run: go test ./...

      - name: Test desktop backend
        working-directory: desktop
        run: go test ./...

      - name: Test frontend
        run: npm test --prefix desktop/frontend

      - name: Build frontend
        run: npm run build --prefix desktop/frontend

      - name: Check Windows compilation
        if: runner.os == 'Windows'
        working-directory: desktop
        run: go build .
